plugins {
    id 'com.android.application'
}
android {
    namespace 'com.lodoskent.makrosafe'
    compileSdk 35
    defaultConfig {
        applicationId 'com.lodoskent.makro.safe'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '2.4-safe'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
