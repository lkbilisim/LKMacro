name: APK Olustur

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynaklari getir
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Android SDK paketlerini kur
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"
      - name: LK uygulama ikonunu hazirla
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 -d branding/LK_ikon.webp.base64 > app/src/main/res/drawable-nodpi/lk_launcher_icon.webp
          test -s app/src/main/res/drawable-nodpi/lk_launcher_icon.webp
          file app/src/main/res/drawable-nodpi/lk_launcher_icon.webp
      - name: APK derle
        run: gradle --no-daemon :app:assembleDebug
      - name: APK imzasini ve paket yapisini dogrula
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -1
      - name: APK dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: LK-Makro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Warline v2.5 guvenlik korumalarini denetle
        run: |
          test -f app/src/main/java/com/lodoskent/makro/WarlineAutoBot.java
          grep -q "private boolean goldRisk" app/src/main/java/com/lodoskent/makro/WarlineAutoBot.java
          grep -q "if(goldRisk(raw))" app/src/main/java/com/lodoskent/makro/WarlineAutoBot.java
          grep -q 'armedTask=' app/src/main/java/com/lodoskent/makro/WarlineAutoBot.java
          grep -q 'inWarline()' app/src/main/java/com/lodoskent/makro/WarlineAutoBot.java
      - name: APK dosyasini dogrudan indirmeye sun
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/LK_Makro_v2.5_Akilli_Otomasyon.apk
          cat > release-info.txt <<'EOF'
          LK Makro v2.5 - OCR ile canli ve sinirli otomasyon pilotu.
          Ekran Accessibility izniyle okunur. Kullanici akilli botu manuel baslatir.
          Yalnizca iki kez OCR ile dogrulanan belirli ucretsiz eylemler:
          Ganimet/Tumunu Al, bazi ittifak yardimlari, tamamlanan arastirmalari kapatma.
          Radar, seferberlik, asker yetistirme ve tam ekranlar arasi gezinme
          henuz aktif degildir; yanlis harcama riskini azaltmak icin devre disidir.
          OCR ile 0 altin harcamayi kesin olarak garanti etmek mumkun degildir.
          Uygulamayi dikkatli deneyin. Play Protect engelini zorla gecmeyin.
          GitHub Actions debug sertifikasi oncekilerle ayni olmayabilir.
          EOF
          if gh release view v2.5-auto >/dev/null 2>&1; then
            gh release upload v2.5-auto dist/LK_Makro_v2.5_Akilli_Otomasyon.apk --clobber
          else
            gh release create v2.5-auto dist/LK_Makro_v2.5_Akilli_Otomasyon.apk --target "${{ github.sha }}" --title "LK Makro v2.5 Akilli Otomasyon" --notes-file release-info.txt
          fi
