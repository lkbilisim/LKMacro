name: APK Olustur

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynaklari getir
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Android SDK paketlerini kur
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"
      - name: LK uygulama ikonunu hazirla
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 -d branding/LK_ikon.webp.base64 > app/src/main/res/drawable-nodpi/lk_launcher_icon.webp
          test -s app/src/main/res/drawable-nodpi/lk_launcher_icon.webp
          file app/src/main/res/drawable-nodpi/lk_launcher_icon.webp
      - name: APK derle
        run: gradle --no-daemon :app:assembleDebug
      - name: APK imzasini ve paket yapisini dogrula
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -1
      - name: APK dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: LK-Makro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: APK dosyasini GitHub Surumune yukle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk LK_Makro_v2.3_Akilli_Gorus.apk
          if gh release view v2.3 >/dev/null 2>&1; then
            gh release upload v2.3 LK_Makro_v2.3_Akilli_Gorus.apk --clobber
          else
            gh release create v2.3 LK_Makro_v2.3_Akilli_Gorus.apk --target "${{ github.sha }}" --title "LK Makro v2.3 — Akıllı Görüş" --notes "Cihaz içi OCR ile ekranı okuma, 11 görevli kalıcı rastgele planlayıcı ve altın harcamadan gözlem modu. Android 13 emülatöründe erişilebilirlik hizmeti test edildi. Oyun içi otomatik görev yürütme henüz etkin değil."
          fi
