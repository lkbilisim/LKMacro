name: LK Erişilebilirlik Telefon Testi

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Kaynagi al
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"
      - name: LK logosunu hazirla
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 -d branding/LK_ikon.webp.base64 > app/src/main/res/drawable-nodpi/lk_launcher_icon.webp
      - name: APK olustur
        run: gradle --no-daemon :app:assembleDebug
      - name: KVM izinleri
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 13 emulator testi
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/smoke.sh
      - name: Hata kayitlarini sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LK-Android-Diagnostik
          path: smoke-output/
          if-no-files-found: ignore
