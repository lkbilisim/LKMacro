name: LK Guvenli Gorus APK

on:
  push:
    branches: [main]
    paths:
      - "safe/**"
      - "settings.gradle"
      - ".github/workflows/build-safe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  secure-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"
      - name: Original LK icon
        run: |
          mkdir -p safe/src/main/res/drawable-nodpi
          base64 -d branding/LK_ikon.webp.base64 > safe/src/main/res/drawable-nodpi/lk_launcher_icon.webp
          test -s safe/src/main/res/drawable-nodpi/lk_launcher_icon.webp
      - name: Build standalone OCR APK
        run: gradle --no-daemon :safe:assembleDebug
      - name: Verify APK signature and reject unexpected permissions
        run: |
          set -euo pipefail
          APK=safe/build/outputs/apk/debug/safe-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          unzip -t "$APK" | tail -1
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | tee permission-report.txt
          if grep -E "uses-permission:|uses-implied-permission:" permission-report.txt; then
            echo "Unexpected permission detected. Refusing to publish!"
            exit 1
          fi
          if unzip -p "$APK" AndroidManifest.xml | strings | grep -E "BIND_ACCESSIBILITY_SERVICE|AccessibilityService"; then
            echo "Unexpected accessibility service reference!"
            exit 1
          fi
      - name: Start on Android 13 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r safe/build/outputs/apk/debug/safe-debug.apk
            adb logcat -c
            adb shell am start -n com.lodoskent.makro.safe/com.lodoskent.makrosafe.SafeActivity
            sleep 9
            adb shell dumpsys activity activities | grep "com.lodoskent.makro.safe" || exit 1
            if adb logcat -d -v brief | grep -A 12 "FATAL EXCEPTION" | grep "com.lodoskent.makro.safe"; then
              echo "SAFE APP CRASHED"; exit 1
            fi
            echo "LK safe OCR UI launched without Android crash"
      - name: Prepare direct APK
        run: |
          mkdir -p dist
          cp safe/build/outputs/apk/debug/safe-debug.apk dist/LK_Makro_v2.4_Guvenli_Gorus.apk
      - name: Upload direct APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LK-Makro-Guvenli-Gorus-APK
          path: dist/LK_Makro_v2.4_Guvenli_Gorus.apk
          if-no-files-found: error
      - name: Publish direct APK GitHub release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.txt <<'EOF'
          LK Makro Güvenli Görüş v2.4: Separate minimal-permission, offline OCR and task scheduler. NO Accessibility Service, NO taps, NO internet, NO screen recording. To read Warline, manually choose a screenshot with the system file picker. This diagnostic build is debug-signed; it is not Play Protect approved, and sideloading may still be blocked. The original automated macro remains a separate app.
          EOF
          gh release create v2.4-safe dist/LK_Makro_v2.4_Guvenli_Gorus.apk --title "LK Makro v2.4 - Guvenli Gorus" --notes-file release-notes.txt
