name: APK Olustur

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynaklari getir
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Android SDK paketlerini kur
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"
      - name: APK derle
        run: gradle --no-daemon :app:assembleDebug
      - name: APK dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: LDK-Makro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
