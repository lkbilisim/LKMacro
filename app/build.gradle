plugins {
    id 'com.android.application'
}
android {
    namespace 'com.lodoskent.makro'
    compileSdk 35
    defaultConfig {
        applicationId 'com.lodoskent.makro'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '2.5'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
